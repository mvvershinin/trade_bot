# CI: тесты, линтер и типы на Linux. Заводится задачей владельца счёта
# 07.09.2026 — «инфраструктуры вокруг кода нет, всё держится на дисциплине
# автора». Разбор, чем это проверено и что не проверено первым прогоном —
# .docs/packaging/packaging-expert-ci-2026-09-07-*.md.
#
# Чего здесь СПЕЦИАЛЬНО нет:
#   * сборки Nuitka — она идёт десятки минут (решение 0001), запускать её на
#     каждый push нельзя; появится отдельным файлом по тегу, когда понадобится;
#   * матрицы Windows — сначала один зелёный прогон на Linux, дальше разговор;
#   * секретов — тесты в сеть не ходят (сторож `no_internet`, `D-020`), токен
#     брокера в тестах не участвует ни настоящий, ни выдуманный (правило 8).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Новый пуш в ту же ветку/PR отменяет предыдущий прогон вместо очереди —
# не тратим минуты раннера на заведомо устаревший коммит.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты, линтер, типы (Linux)
    # ⚠️ Явно ubuntu-24.04, а не ubuntu-latest. Список системных библиотек Qt
    # ниже проверен ИМЕННО на этом образе — с нуля, в одноразовом докер-
    # контейнере ubuntu:24.04, без единого лишнего пакета (методика и лог
    # в отчёте). Молчаливый переход раннера на другой LTS может незаметно
    # поменять состав библиотек и список ниже перестанет быть проверенным —
    # тот же довод, по которому в pyproject.toml зафиксированы версии Nuitka,
    # ruff, mypy и uv.
    runs-on: ubuntu-24.04
    # Замер: холодный прогон (без кэша uv, без кэша mypy) занял в проверке
    # ~4 минуты целиком (установка ~3.5 мин + тесты ~35 с на 12 ядрах этой
    # машины). У раннера 2–4 ядра — тесты будут медленнее; 20 минут — щедрый
    # запас на первый прогон и на случай зависшей сети, а не ожидаемое время.
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # ⚠️ PySide6 на голом раннере не поднимает даже offscreen-платформу без
      # системных библиотек — офскрин снимает требование к X11/Wayland,
      # но не к самим .so, от которых зависит libQt6Gui. Список получен не
      # по памяти и не «на всякий случай», а по факту: в одноразовом докер-
      # контейнере ubuntu:24.04 с одним Python и pip внутри создание
      # QApplication под QT_QPA_PLATFORM=offscreen падало пять раз подряд
      # с ImportError на недостающей библиотеке, каждая строка ниже закрыла
      # ровно одну ошибку по очереди: libGL.so.1, libxkbcommon.so.0,
      # libEGL.so.1, libglib-2.0.so.0, libdbus-1.so.3. После пятой библиотеки
      # QApplication создаётся, и полный прогон тестов (3600 штук, включая
      # ui/) в том же контейнере прошёл без единой ошибки импорта Qt.
      # QtCharts, QtWebEngine и прочие модули Qt, которых тесты не трогают,
      # своих системных библиотек сверх этих пяти не потребовали — PySide6
      # несёт остальное сам.
      - name: Системные библиотеки Qt (offscreen)
        run: |
          # ⚠️ В образе бегунка лежат сторонние репозитории, которыми мы
          # не пользуемся. Замер 08.09.2026: packages.microsoft.com отдал
          # 403 Forbidden, `apt-get update` вышел с кодом 100, и прогон упал
          # на шаге установки библиотек Qt — при полностью исправном коде.
          # Соседний PR в те же минуты прошёл зелёным, то есть отказ плавучий.
          # Убираем чужие списки до обновления: так отказ ИМЕННО репозиториев
          # Ubuntu по-прежнему роняет шаг, а чужая поломка нас не касается.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/microsoft*.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libglib2.0-0 \
            libdbus-1-3

      # enable-cache: true — явно, а не по умолчанию `auto`. Умолчание уже
      # включает кэш для push/pull_request на GitHub-раннере, но явная
      # настройка не сломается молча, если список триггеров когда-нибудь
      # расширят (например, добавят release) — тот же довод против неявного
      # поведения, что и во всём остальном проекте.
      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      # --locked: протухший uv.lock ронять прогон явной ошибкой, а не
      # пересчитывать его тут же молча. Если этот шаг красный — это находка
      # о рассинхроне pyproject.toml и uv.lock, а не о CI (см. отчёт: на
      # 07.09.2026 такой рассинхрон уже есть и найден до этого шага).
      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      # Справочный вывод. Порог, роняющий прогон, живёт в pytest
      # (tests/test_lint_ratchet.py), не здесь — `continue-on-error: true`
      # не даёт этому шагу самому решать «упал прогон целиком или нет».
      # Шаг честно покажет предупреждение (реальных находок 575/190, это не
      # ноль), но job из-за него не остановится — а не притворится, что
      # находок нет, как сделал бы `|| true`, спрятав код возврата целиком.
      - name: ruff (справочно — порог считает pytest)
        run: uv run ruff check .
        continue-on-error: true

      - name: mypy (справочно — порог считает pytest)
        run: uv run mypy
        continue-on-error: true

      # Полный прогон, без -m "not slow": раннер работает раз на push/PR,
      # а не на каждую правку разработчика (та экономия — для локального
      # цикла, см. TESTING.md), и полный прогон включает подпроцессные тесты
      # и (там, где reference/ есть) сверку с прототипом.
      #
      # ⚠️ Зелёный прогон здесь НЕ проверяет совпадение с прототипом.
      # Каталог reference/ в репозиторий не входит намеренно (гигиена
      # репозитория, CLAUDE.md) — на CI, как и в любом свежем клоне, все
      # тесты сверки сделка-в-сделку пропускаются. `tests/conftest.py` уже
      # печатает это отдельным разделом «ПРОПУЩЕНО» с явным предупреждением;
      # следующий шаг вытаскивает эти строки в сводку прогона, чтобы их было
      # видно без открытия лога.
      - name: Тесты
        run: |
          set -o pipefail
          uv run pytest -n auto --durations=10 --durations-min=1.0 2>&1 | tee pytest-output.log

      - name: Пропуски сверки — в сводку прогона
        if: always()
        run: |
          set -o pipefail
          {
            echo "### Итог прогона pytest"
            echo
            echo '```'
            grep -E '^[0-9]+ (passed|failed)' pytest-output.log | tail -n 1 \
              || echo "итоговая строка не найдена — смотри лог шага «Тесты»"
            echo '```'
            echo
            if grep -q "сверок с эталоном" pytest-output.log; then
              echo "⚠️ Совпадение с прототипом в этом прогоне НЕ проверено:"
              echo
              echo '```'
              grep "сверок с эталоном" pytest-output.log | sed 's/^[[:space:]]*//'
              echo '```'
              echo
              echo "Полный список пропущенных — в логе шага «Тесты», раздел «ПРОПУЩЕНО»."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
