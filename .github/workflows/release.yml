# Сборка портативной поставки по тегу и публикация в Releases.
# Заведено задачей владельца счёта 08.09.2026: «про линукс просто написать
# в документации... а если это бесплатно — давай сделаем и тэг первый
# выкатим». Разбор, чем каждый шаг проверен и что проверится только первым
# настоящим тегом — .docs/packaging/packaging-expert-release-2026-09-08-*.md.
#
# ⚠️ Триггер — ТЕГ вида v*, не push и не pull_request. Nuitka на Qt-проекте
# идёт минуты (мера — 261 с на 12 ядрах разработки, см. отчёт), а на
# GitHub-раннере (обычно 4 ядра) дольше; гонять это на каждый коммит нельзя
# (решение 0001, .github/workflows/ci.yml).
#
# ⚠️ Windows-машины у проекта нет вообще — джоб `build-windows` не проверен
# живьём ни разу, включая MinGW64 (Nuitka качает его сама через
# `--assume-yes-for-downloads`, это её штатный и рекомендованный путь, а не
# костыль) и кодировки консоли/CRLF. Первый настоящий тег — первая живая
# проверка. Если упадёт — это находка о Windows-раннере, а не о замысле.
name: Release

on:
  push:
    tags:
      - "v*"

# gh release create/upload пишет в Releases репозитория этим токеном.
# Секретов не заводим — токен выдаётся GitHub автоматически на каждый прогон.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Тег → версия. Один раз, остальные джобы читают результат через needs.
  # ------------------------------------------------------------------
  version:
    name: Версия из тега
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Разобрать и проверить тег
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Строго X.Y.Z: этого просит и Nuitka (--file-version/--product-version
          # на Windows — числовые поля), и `tools/set_version.py`, и pyproject.toml
          # (версия обязана быть PEP 440). Суффиксы вида -rc1 сюда сознательно
          # не пущены — на них пришлось бы отдельно решать, что видит Windows
          # в свойствах файла; для первого тега это лишний вопрос.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::тег «$TAG» не похож на vX.Y.Z (три числа через точку, без суффиксов) — останавливаюсь, а не гадаю"
            exit 1
          fi
          echo "тег $TAG -> версия $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Быстрый прогон тестов перед тем, как тратить десятки минут на сборку
  # под два раннера. Не входил в буквальный список задачи, добавлен как
  # дешёвая (по опорным числам — 72 с) страховка: тег может быть поставлен
  # на коммит, который никогда не гонял обычный CI. Список системных
  # библиотек Qt — тот же самый и по той же причине, что в ci.yml.
  # ------------------------------------------------------------------
  test:
    name: Тесты перед сборкой (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Системные библиотеки Qt (offscreen) — тот же список, что в ci.yml
        run: |
          # ⚠️ В образе бегунка лежат сторонние репозитории, которыми мы
          # не пользуемся. Замер 08.09.2026: packages.microsoft.com отдал
          # 403 Forbidden, `apt-get update` вышел с кодом 100, и прогон упал
          # на шаге установки библиотек Qt — при полностью исправном коде.
          # Соседний PR в те же минуты прошёл зелёным, то есть отказ плавучий.
          # Убираем чужие списки до обновления: так отказ ИМЕННО репозиториев
          # Ubuntu по-прежнему роняет шаг, а чужая поломка нас не касается.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/microsoft*.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3

      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      - name: Тесты
        run: uv run pytest -n auto -q

  # ------------------------------------------------------------------
  # Linux: AppImage, не tar.gz — решение 0001. Собирается на СТАРОЙ базе
  # (ubuntu:22.04 в контейнере джоба, а не ubuntu-latest раннера — тот
  # едет на 24.04/25.xx и дал бы бинарь, которому нужен более свежий
  # glibc, чем стоит у заказчика) тем же рецептом, что проверялся вручную
  # 30.09.2026 на чистой машине (.docs/packaging/packaging-expert-
  # 2026-09-30-1106.md): glibc-потолок 2.35 подтверждён там `objdump -T`.
  #
  # Рецепт — один файл `tools/build_appimage.sh`, а не россыпь шагов YAML:
  # тот же скрипт гоняется и здесь, и локально в голом `ubuntu:22.04`
  # (`docker run --rm -v ... ubuntu:22.04 sh tools/build_appimage.sh`) —
  # «проверено локально» и «идёт в CI» буквально одна и та же команда.
  # ------------------------------------------------------------------
  build-linux:
    name: Сборка — Linux (AppImage)
    needs: [version, test]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    timeout-minutes: 60
    # В контейнере оболочка по умолчанию — `sh` (dash): `set -o pipefail`
    # в нём запрещён, джоб падал на первой строке (тег v0.2.0, 30.09.2026).
    defaults:
      run:
        shell: bash
    env:
      TERMINAL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # git ставится ДО checkout: у actions/checkout свой git-клиент,
      # а в голом ubuntu:22.04 (контейнер джоба) git не установлен вовсе —
      # без этого шага чекаут откатится на скачивание тарбола без `.git`,
      # или просто упадёт, в зависимости от версии действия. Остальные
      # системные пакеты (build-essential, python3.12, ...) — уже внутри
      # tools/build_appimage.sh, тем же списком, что проверен вручную.
      - name: git и сертификаты (нужны checkout'у до того, как он запустится)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Один скрипт: системные пакеты, python3.12 из deadsnakes (не из
      # actions/setup-python — версия и сборка Python обязаны быть теми
      # же, что вчера прошли чистую машину, а не другим Python из другого
      # источника), uv 0.12.7, версия в pyproject.toml (с той же проверкой
      # метаданных, что раньше жила прямо в этом файле — разбор см.
      # .docs/packaging/packaging-expert-release-2026-09-08-*.md), Nuitka,
      # PNG-иконка, appimagetool + type2-runtime со сверкой sha256, сборка
      # Terminal.AppImage. Подробности — в самом tools/build_appimage.sh.
      - name: Собрать Terminal.AppImage
        run: sh tools/build_appimage.sh

      - name: Загрузить артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: dist/Terminal.AppImage
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Windows: то же самое по форме, MinGW64 Nuitka качает сама.
  # ------------------------------------------------------------------
  build-windows:
    name: Сборка — Windows
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TERMINAL_VERSION: ${{ needs.version.outputs.version }}
      # Русский текст в выводе сборочных скриптов против cp1252 на Windows.
      PYTHONUTF8: '1'
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      # ⚠️ shell: bash (Git Bash) — не PowerShell. `tools/set_version.py`
      # сам защищён от CRLF (см. его докстринг), но остальные команды здесь
      # обычный POSIX-шелл, тот же код, что и в джобе Linux — одна и та же
      # логика на обеих ОС, а не две параллельные, которые могут разойтись.
      - name: Версия — из тега в pyproject.toml
        run: |
          set -euo pipefail
          python tools/set_version.py "$TERMINAL_VERSION"
          uv sync --all-groups
          FOUND="$(uv run --no-sync python -c "from importlib import metadata; print(metadata.version('terminal'))")"
          echo "importlib.metadata.version('terminal') = $FOUND"
          if [ "$FOUND" != "$TERMINAL_VERSION" ]; then
            echo "::error::после правки pyproject.toml метаданные пакета показывают '$FOUND', а ожидалась '$TERMINAL_VERSION'. Останавливаюсь, не собираю дальше."
            exit 1
          fi

      # `--mingw64 --assume-yes-for-downloads` в tools/build.py — Nuitka САМА
      # качает свой MinGW64, это её официально рекомендованный путь на
      # Windows без готового компилятора, а не обходной приём (проверено
      # по документации Nuitka 08.09.2026, живьём на Windows — нет, машины
      # нет). Первый прогон здесь и покажет, сколько именно занимает загрузка.
      # ⚠️ Замер 08.09.2026, тег v0.1.0: сборка упала за 26 секунд, не начав
      # компиляцию. `tools/make_icon.py:93` печатает размер иконки строкой
      # с русской «Б», а Python на бегунке Windows отдаёт stdout в cp1252 —
      # `UnicodeEncodeError: 'charmap' codec can't encode character '\u0411'`.
      # Наша сборочная оснастка не работала на Windows потому, что говорит
      # с человеком по-русски. Режим UTF-8 включается на всё задание: русский
      # текст печатают и `windows_package.py`, и сам `build.py`.
      - name: Сборка Nuitka (MinGW64)
        run: uv run python tools/build.py

      - name: Упаковка — снять userdata, README, Запустить.bat, архив
        run: uv run python tools/windows_package.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-archive
          path: dist/Terminal-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Публикация — только если ОБЕ сборки удались. Если платформа одна
  # красная, а другая зелёная, `needs` не даёт этому джобу начаться вовсе:
  # релиз с одной архитектурой из двух не появится сам по себе, тихо.
  # ------------------------------------------------------------------
  release:
    name: Публикация в Releases
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Скачать оба артефакта
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # ⚠️ Склейка БЕЗУСЛОВНАЯ: если .github/RELEASE_D113_WARNING.md
      # пропадёт (например, его удалили без правки этого шага, см. рецепт
      # возврата D-113 в .docs/BACKLOG.md), `cat` на несуществующий файл
      # упадёт с ненулевым кодом и `set -euo pipefail` остановит джоб —
      # релиз без предупреждения не выйдет молча (правило 13).
      - name: Собрать текст релиза из заготовки
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat .github/RELEASE_D113_WARNING.md .github/RELEASE_TEMPLATE.md \
            | sed "s/__VERSION__/${VERSION}/g" > release-notes.md

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "Терминал ${VERSION}" \
            --notes-file release-notes.md \
            artifacts/linux-appimage/Terminal.AppImage \
            artifacts/windows-archive/*.zip
