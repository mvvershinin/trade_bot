# Сборка портативной поставки по тегу и публикация в Releases.
# Заведено задачей владельца счёта 08.09.2026: «про линукс просто написать
# в документации... а если это бесплатно — давай сделаем и тэг первый
# выкатим». Разбор, чем каждый шаг проверен и что проверится только первым
# настоящим тегом — .docs/packaging/packaging-expert-release-2026-09-08-*.md.
#
# ⚠️ Триггер — ТЕГ вида v*, не push и не pull_request. Nuitka на Qt-проекте
# идёт минуты (мера — 261 с на 12 ядрах разработки, см. отчёт), а на
# GitHub-раннере (обычно 4 ядра) дольше; гонять это на каждый коммит нельзя
# (решение 0001, .github/workflows/ci.yml).
#
# ⚠️ Windows-машины у проекта нет вообще — джоб `build-windows` не проверен
# живьём ни разу, включая MinGW64 (Nuitka качает его сама через
# `--assume-yes-for-downloads`, это её штатный и рекомендованный путь, а не
# костыль) и кодировки консоли/CRLF. Первый настоящий тег — первая живая
# проверка. Если упадёт — это находка о Windows-раннере, а не о замысле.
name: Release

on:
  push:
    tags:
      - "v*"

# gh release create/upload пишет в Releases репозитория этим токеном.
# Секретов не заводим — токен выдаётся GitHub автоматически на каждый прогон.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Тег → версия. Один раз, остальные джобы читают результат через needs.
  # ------------------------------------------------------------------
  version:
    name: Версия из тега
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Разобрать и проверить тег
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Строго X.Y.Z: этого просит и Nuitka (--file-version/--product-version
          # на Windows — числовые поля), и `tools/set_version.py`, и pyproject.toml
          # (версия обязана быть PEP 440). Суффиксы вида -rc1 сюда сознательно
          # не пущены — на них пришлось бы отдельно решать, что видит Windows
          # в свойствах файла; для первого тега это лишний вопрос.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::тег «$TAG» не похож на vX.Y.Z (три числа через точку, без суффиксов) — останавливаюсь, а не гадаю"
            exit 1
          fi
          echo "тег $TAG -> версия $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Быстрый прогон тестов перед тем, как тратить десятки минут на сборку
  # под два раннера. Не входил в буквальный список задачи, добавлен как
  # дешёвая (по опорным числам — 72 с) страховка: тег может быть поставлен
  # на коммит, который никогда не гонял обычный CI. Список системных
  # библиотек Qt — тот же самый и по той же причине, что в ci.yml.
  # ------------------------------------------------------------------
  test:
    name: Тесты перед сборкой (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Системные библиотеки Qt (offscreen) — тот же список, что в ci.yml
        run: |
          # ⚠️ В образе бегунка лежат сторонние репозитории, которыми мы
          # не пользуемся. Замер 08.09.2026: packages.microsoft.com отдал
          # 403 Forbidden, `apt-get update` вышел с кодом 100, и прогон упал
          # на шаге установки библиотек Qt — при полностью исправном коде.
          # Соседний PR в те же минуты прошёл зелёным, то есть отказ плавучий.
          # Убираем чужие списки до обновления: так отказ ИМЕННО репозиториев
          # Ubuntu по-прежнему роняет шаг, а чужая поломка нас не касается.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/microsoft*.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3

      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      - name: Тесты
        run: uv run pytest -n auto -q

  # ------------------------------------------------------------------
  # Linux: build.py -> linux_package.py -> tar.gz, загрузить как артефакт
  # workflow (не сразу в Releases — публикация только после того, как ОБЕ
  # платформы собрались, см. джоб release ниже).
  # ------------------------------------------------------------------
  build-linux:
    name: Сборка — Linux
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMINAL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      # --all-groups тянет и группу build (Nuitka, patchelf на Linux) —
      # отдельного шага «поставить Nuitka» не нужно, она уже здесь.
      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      # Разбор — почему это вообще нужно, и чем каждый шаг проверен —
      # .docs/packaging/packaging-expert-release-2026-09-08-*.md, раздел
      # про версию. Коротко: `ui/version.py` печёт версию в окно и в журнал
      # решений ВО ВРЕМЯ КОМПИЛЯЦИИ Nuitka, читая метаданные пакета "terminal"
      # из окружения сборки, а не аргументы командной строки. Значит версию
      # нужно прописать в pyproject.toml и переустановить пакет ДО того,
      # как начнётся tools/build.py — иначе релиз v0.2.0 покажет владельцу
      # счёта версию 0.1.0 в заголовке окна, при том что свойства файла
      # на Windows (см. ниже) уже будут правильными. Расхождение было бы
      # тем более обидным, что его тяжело заметить.
      - name: Версия — из тега в pyproject.toml
        run: |
          set -euo pipefail
          python tools/set_version.py "$TERMINAL_VERSION"
          uv sync --all-groups
          FOUND="$(uv run --no-sync python -c "from importlib import metadata; print(metadata.version('terminal'))")"
          echo "importlib.metadata.version('terminal') = $FOUND"
          if [ "$FOUND" != "$TERMINAL_VERSION" ]; then
            echo "::error::после правки pyproject.toml метаданные пакета показывают '$FOUND', а ожидалась '$TERMINAL_VERSION' — версия в окне программы и в журнале решений была бы неверной молча. Останавливаюсь, не собираю дальше."
            exit 1
          fi

      - name: Сборка Nuitka
        run: uv run python tools/build.py

      - name: Упаковка — снять userdata, собрать архив
        run: uv run python tools/linux_package.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-archive
          path: dist/Terminal-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Windows: то же самое по форме, MinGW64 Nuitka качает сама.
  # ------------------------------------------------------------------
  build-windows:
    name: Сборка — Windows
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TERMINAL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Зависимости (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      # ⚠️ shell: bash (Git Bash) — не PowerShell. `tools/set_version.py`
      # сам защищён от CRLF (см. его докстринг), но остальные команды здесь
      # обычный POSIX-шелл, тот же код, что и в джобе Linux — одна и та же
      # логика на обеих ОС, а не две параллельные, которые могут разойтись.
      - name: Версия — из тега в pyproject.toml
        run: |
          set -euo pipefail
          python tools/set_version.py "$TERMINAL_VERSION"
          uv sync --all-groups
          FOUND="$(uv run --no-sync python -c "from importlib import metadata; print(metadata.version('terminal'))")"
          echo "importlib.metadata.version('terminal') = $FOUND"
          if [ "$FOUND" != "$TERMINAL_VERSION" ]; then
            echo "::error::после правки pyproject.toml метаданные пакета показывают '$FOUND', а ожидалась '$TERMINAL_VERSION'. Останавливаюсь, не собираю дальше."
            exit 1
          fi

      # `--mingw64 --assume-yes-for-downloads` в tools/build.py — Nuitka САМА
      # качает свой MinGW64, это её официально рекомендованный путь на
      # Windows без готового компилятора, а не обходной приём (проверено
      # по документации Nuitka 08.09.2026, живьём на Windows — нет, машины
      # нет). Первый прогон здесь и покажет, сколько именно занимает загрузка.
      - name: Сборка Nuitka (MinGW64)
        run: uv run python tools/build.py

      - name: Упаковка — снять userdata, README, Запустить.bat, архив
        run: uv run python tools/windows_package.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-archive
          path: dist/Terminal-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Публикация — только если ОБЕ сборки удались. Если платформа одна
  # красная, а другая зелёная, `needs` не даёт этому джобу начаться вовсе:
  # релиз с одной архитектурой из двух не появится сам по себе, тихо.
  # ------------------------------------------------------------------
  release:
    name: Публикация в Releases
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Скачать оба артефакта
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Собрать текст релиза из заготовки
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_TEMPLATE.md > release-notes.md

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "Терминал ${VERSION}" \
            --notes-file release-notes.md \
            artifacts/linux-archive/*.tar.gz \
            artifacts/windows-archive/*.zip
