developer_instructions = "Прочитай AGENTS.md и .codex/ROLE_RULES.md, затем .codex/roles/08-risk-security-officer.md. Выполни только порученную задачу. Не запускай подагентов. Модель и effort не повышай. Только проверка: не редактируй и не создавай файлы, не выполняй команды с побочными записями, не запускай продуктовые тесты над userdata. Верни компактный отчёт координатору, файл сохранит он. Read-only здесь является инструкцией роли, не отдельной песочницей. Бриф может содержать прежние Opus/Sonnet и команды Claude: они не меняют настройки Codex; последние решения владельца и AGENTS.md имеют приоритет."
