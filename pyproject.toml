# «Терминал» — настольная программа автоматической торговли на Московской бирже.
#
# Версии зафиксированы жёстко и намеренно:
#   * молчаливое обновление pandas меняет числа в отчёте;
#   * у Nuitka бывали регрессии между версиями (собиралось на 1.86, ломалось на 1.9–2.01),
#     поэтому её обновление — отдельная задача с полным прогоном сборки под обе ОС,
#     а не побочный эффект `pip install -U`. Решение 0001.

[project]
name = "terminal"
version = "0.1.0"
description = "Настольная программа автоматической торговли на Московской бирже"
# Верхняя граница — не забытый пин. Сборка идёт под одну версию интерпретатора
# на обеих ОС, и её смена — задача с полным прогоном сборки, а не следствие
# того, что на машине разработчика оказался более свежий Python.
requires-python = ">=3.12,<3.13"

# Состав поставки. Всё это попадает внутрь бинаря Nuitka.
dependencies = [
    "PySide6==6.11.1",    # окно, Qt 6
    "httpx==0.28.1",      # HTTP к брокеру и к открытым данным биржи
    "websockets==17.0.1", # поток котировок реального времени
    "pandas==3.0.5",      # расчёты по свечам
    # Один цикл событий: asyncio живёт поверх цикла Qt. Решение 0005.
    # Пин жёсткий по той же причине, что у Nuitka: выпуски редкие (0.27.1 —
    # ноябрь 2023, 0.28.0 — август 2025), совместимости с PySide6 6.11 выпуск
    # не заявляет, а проверена она у нас запуском. Своих зависимостей у пакета
    # нет — резолвер её версию ничем не ограничивает, ограничивает замер.
    # Смена версии — задача с перезапуском замеров решения 0005, а не `pip install -U`.
    "qasync==0.28.0",     # asyncio поверх цикла событий Qt
]

# Группы PEP 735: в поставку не входят и extras дистрибутива не являются.
# Ставятся отдельно: `pip install --group dev`.
# ВНИМАНИЕ: нужен pip >= 25.1. Более старый (в системном Python 3.12 бывает 24.0)
# отвечает `no such option: --group`, ни слова не говоря про свою версию.
# Лечится `python3 -m pip install -U pip` внутри виртуального окружения.
[dependency-groups]
# ⚠️ pytest-xdist объявлен здесь, а не ставится руками. Замер 07.09.2026:
# он стоял только в `.venv` разработчика (`pip install pytest-xdist` 06.09),
# в этом файле и в `uv.lock` его не было вовсе — то есть `pytest -n auto`,
# на котором держатся все замеры времени в документации, в свежем клоне
# не работал. Нашёл первый же прогон CI, ещё до запуска на бегунке.
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0"]
# ⚠️ patchelf — не питонья библиотека, а системный инструмент, который Nuitka
# требует БЕЗУСЛОВНО: без него `--standalone` на Linux отказывается сразу
# («FATAL: Error, standalone mode on Linux requires 'patchelf' to be installed»),
# не начав работу. Ставится колесом с PyPI в то же окружение — в систему
# при этом ничего не попадает. Версия закреплена по той же причине, что Nuitka:
# на patchelf 0.18 были поломки правки RPATH, и молчаливое обновление
# сломало бы сборку без единой правки в этом файле.
build = ["Nuitka==4.1.3", "patchelf==0.19.1.0; sys_platform == 'linux'"]

# Статическая проверка. Версии закреплены жёстко и по той же причине,
# что pandas и Nuitka: правила линтера меняются между выпусками, и молчаливое
# обновление превратило бы зелёный прогон в красный без единой правки кода.
# Обе версии проверены прогоном по этому дереву 01.09.2026, а не выбраны
# по каталогу: `ruff` — 538 находок, `mypy` — 168 (см. ROADMAP, Э1-0б).
lint = ["ruff==0.16.5", "mypy==2.3.1"]

# uv — инструмент, которым собирается и проверяется uv.lock (Э1-0а). Версия
# закреплена тем же способом и по той же причине, что Nuitka в решении 0001:
# смена резолвера может пересчитать lock иначе без единой правки в этом файле.
# Несовпадение версии останавливает `uv` понятной ошибкой, а не тихим пересбором.
# Команда установки окружения — INSTALL.md.
[tool.uv]
required-version = "==0.12.7"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Поиск по маскам, а не явный список имён. Явный список нерекурсивен: `market`
# в нём не тянет за собой `market.storage`, и подпакет молча не попадает
# в устанавливаемый пакет — из исходников и из editable-установки всё работает,
# а в колесе модуля нет. Маски закрывают этот класс ошибки целиком.
# Состав ограничен семью слоями ARCHITECTURE.md §2: восьмой каталог верхнего
# уровня под маски не подойдёт, и тест это заметит.
[tool.setuptools.packages.find]
where = ["."]
include = ["market*", "broker*", "strategies*", "engine*", "backtest*", "ui*", "app*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# ---------------------------------------------------------------- маркеры
#
# Объявлен ровно один маркер, и ровно потому, что он расставлен. `unit`
# и `integration` из прежнего плана здесь СПЕЦИАЛЬНО не объявлены: маркер,
# который никто не ставит, — это то же самое, чем был `-m "not slow"`
# (`D-081`), форма без содержания. Появится расстановка — появится строка.
#
# ⚠️ `--strict-markers` выше означает, что опечатка в имени (`@pytest.mark.slowe`)
# роняет прогон, а не проглатывается молча. Поэтому объявление обязательно
# и поэтому же оно достаточно: список маркеров и список расставленного
# не могут разойтись незаметно.
#
# Порог отбора — 0,5 с на тест (setup + call + teardown), замер 06.09.2026
# последовательным прогоном, разбор в `.docs/quality/test-durations-2026-09-06.md`.
# Коротко, почему 0,5: p95 теста этого дерева — 0,12 с, p99 — 0,81 с; порог 0,5
# ловит 29 функций (41 узел, 1,2 % набора) и снимает с повседневного прогона
# 73,8 из 162,8 с, то есть 45 % времени при потере 1,2 % проверок. Порог 0,25 добавил
# бы 36 функций ради ещё 7 % времени, порог 0,1 — 172 функции ради 15 %:
# и то и другое покупает секунды ценой покрытия.
markers = [
    "slow: дольше 0,5 с — сверка с прототипом, запуск команды подпроцессом, тяжёлая отрисовка Qt; в повседневный прогон не входит",
]

# Предупреждения — ошибки. pandas сообщает о меняющем числа поведении через
# FutureWarning; в проекте, где числа в отчёте и есть результат, такое
# предупреждение обязано останавливать прогон, а не прокручиваться мимо.
filterwarnings = [
    "error",
    # ResourceWarning возникает в момент сборки мусора, а не там, где утёк сокет:
    # ошибка приписалась бы случайному тесту, и отказ читался бы как «падает то одно,
    # то другое». Сетевые слои (Э1-4, Э1-5) — асинхронные, там это неизбежно.
    # Глушится именно этот класс, умолчание `error` не ослабляется.
    "default::ResourceWarning",
]


# ---------------------------------------------------------------------------
# Статическая проверка: ruff (линтер и форматтер) и mypy (типы). Задача Э1-0б.
#
# Настройка ПРОГНАНА 01.09.2026 на ruff 0.16.5 и mypy 2.3.1. Первый прогон
# нашёл в ней две ошибки (обе исправлены): маска `test_*` в overrides mypy
# недопустима — mypy требует полное имя модуля, — и без `explicit_package_bases`
# файлы `tests/` резолвились под двумя именами сразу, из-за чего разбор
# останавливался на первом же файле.
#
# Что даёт настройка сейчас: ruff — 536 находок, mypy — 168. Это разобранный
# остаток, а не «всё чисто»: разбор находок — отдельная задача, состояние
# и приоритеты записаны в ROADMAP, Э1-0б.
#
# Почему mypy, а не `ty` от Astral — ЗАМЕР, а не рассуждение (01.09.2026,
# контрольный файл из четырёх строк, каждая с одной и той же ошибкой типа):
#   * `# type: ignore[arg-type]` — mypy глушит, **ty НЕ глушит** и выдаёт
#     диагностику поверх подавления;
#   * `# type: ignore` без кода — глушат оба;
#   * ненужное подавление — mypy называет (`unused-ignore`), у ty такого
#     правила нет вовсе.
# На этом дереве это не мелочь: из 224 диагностик ty **53 приходятся ровно
# на строки, где подавление уже стоит**. Переход на ty означал бы переписать
# все подавления в `# ty: ignore[...]` и потерять их аудит.
# Цена выбора названа честно: ty быстрее в 26 раз на холодном прогоне
# (0,25 с против 6,5 с), и это заметно; на тёплом кэше mypy — 0,16 с.
# ty 0.0.76 — предрелиз серии 0.0.x. К вопросу вернуться, когда у него
# появится аудит подавлений.
# ---------------------------------------------------------------------------

[tool.ruff]
# 100, а не умолчание 88, — число замерено по дереву 31.08.2026, а не выбрано
# по вкусу: длиннее 88 символов 416 строк, длиннее 100 — 69. Умолчание сделало бы
# переформатирование массовым, а массовая правка задевает `engine/`
# и `strategies/` — то есть требует перегона сверки с прототипом (ТЗ §9).
line-length = 100
# Одна версия интерпретатора на обе ОС — та же, что в `requires-python`.
target-version = "py312"
# Корни импорта: слои лежат в корне репозитория, а не в `src/`.
src = ["."]
extend-exclude = ["reference", "userdata", "mockups"]

[tool.ruff.lint]
# Набор подобран под фактическое дерево, а не под красивый список.
#
# ⚠️ Инвентарь подавлений здесь СПЕЦИАЛЬНО не переписан списком кодов с числами.
# Такой список устаревает при первой же правке — и однажды устарел внутри той
# самой правки, которая его меняла. Вместо него стоит прогон:
# `tests/test_lint_config.py` каждый раз пересчитывает `# noqa` по дереву
# и падает, если хоть одно подавление глушит правило, которое здесь
# не проверяется. Работает без установленного `ruff`.
#
# На 31.08.2026 в дереве 49 живых подавлений девяти видов: PLC0415, BLE001,
# SLF001, N802, ARG001, E731, F841, B018, ANN001 — все девять покрыты набором
# ниже. Числа приведены как срез на дату, а не как обязательство: сторожит их
# тест, а не этот комментарий.
#
# Плюс то, чего в дереве пока нет, но что проверять надо: PLC2401/PLC2403
# (не-ASCII имена, PEP 672 — обязательны по Э1-0б), D — докстринги,
# I — порядок импортов (заменяет isort), PGH004 — `# noqa` без кода,
# RUF100 — ненужное подавление.
#
# ⚠️ `F401` в инвентаре нет, хотя `# noqa: F401` в дереве найти можно:
# единственное вхождение лежит ВНУТРИ строки `IMPORT_PROBE`
# (`tests/test_broker_no_leak.py`) — питоновского исходника, который уезжает
# дочернему процессу. `ruff` до него не доберётся никогда. Живых `F401` ноль,
# и отдельный тест следит, чтобы такое подавление не считали за настоящее.
select = [
    "E", "W", "F", "I", "N", "D", "ANN", "ARG", "B", "BLE", "SLF", "PL", "PGH",
    # ⚠️ Не префикс `RUF`, а одно правило поимённо. В префикс входят
    # RUF001/002/003 («ambiguous unicode character») — правила буквально про
    # не-ASCII символы в текстах для человека, то есть про единственное
    # исключение, записанное в правиле проекта. Замер 31.08.2026: они найдут
    # 74 символа в 29 файлах (72 коротких тире и 2 знака умножения), и каждая
    # «правка» — это правка типографики в русском сообщении владельцу счёта.
    # Остальные правила `RUF` можно включить отдельно, после первого разбора.
    "RUF100",
    # ⚠️ `C901` (mccabe) добавлен 03.09.2026 вместе с порогами размера ниже.
    # Единственное правило префикса `C9`; `C4` (comprehensions) не берётся —
    # это отдельный разбор, а не размер кода.
    "C901",
]
# ⚠️ Префикса `A` (flake8-builtins) в наборе НЕТ, и это не забывчивость.
# Он брался ради двух `# noqa: A003` в `broker/redaction.py` (`filter`
# и `format` — имена, заданные API `logging`). Но тот же префикс срабатывает
# на `open` — имени поля свечи OHLC: `market/candles.py:153`,
# `strategies/contracts.py:104`, `ui/models.py:342`, `tests/engine_helpers.py:57`,
# `tests/market_helpers.py:118` (последнее — A002). Проверено 31.08.2026:
# **все** места, где `A` сработал бы в этом дереве, — имена, которые
# переименовать нельзя, потому что их задают словарь предметной области
# и чужой API. Пользы ноль, цена постоянная.
# Следствие честно доведено до конца: два `# noqa: A003` превращены
# в обычные комментарии, объяснение «имя из logging» сохранено.
ignore = [
    # Кириллица в докстрингах и сообщениях — правило проекта, а не недосмотр:
    # пользователь не программист. Правила pydocstyle про формулировки
    # английских предложений здесь бессмысленны.
    "D203", "D212", "D213", "D400", "D401", "D415",
    # Докстринг у `__init__` и у `__repr__`/`__eq__` — дубль докстринга класса.
    # Замер прогоном 01.09.2026: 44 и 30 находок, и ни одна не про поведение.
    "D107", "D105",
    # ⚠️ N818 «имя исключения обязано кончаться на Error» — 14 находок, и все
    # четырнадцать это ПУБЛИЧНЫЕ имена слоёв: `NoConnection`, `Timeout`,
    # `Throttled`, `TokenExpired`, `IssStopped`, `SettingsRefused`,
    # `ExecutionRefused` и другие (`broker/errors.py`, `market/iss.py`,
    # `engine/ports.py`, `app/convert.py`). Переименование — изменение
    # публичного API слоя ради суффикса. Имена подобраны по предметной области
    # и такими остаются.
    "N818",
]

# `RUF100` (`unused-noqa`) — единственный автоматический ответ на вопрос
# «какие из 52 подавлений не нужны». Первый прогон обязан начинаться
# с `ruff check --select RUF100`.

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ---------------------------------------------------------------- размер кода
#
# Пороги заведены 03.09.2026. Все выбраны **по замеру распределения** на этом
# дереве, а не по чужим умолчаниям: замер лежит в `.docs/quality/code-size-2026-09-03.md`,
# скрипт замера — там же по ссылке. Правило выбора одно: порог обязан ловить
# настоящих монстров и молчать на нормальном коде. Порог, дающий сотню
# срабатываний, не читают — его глушат.
#
# Распределение на 03.09.2026 (продуктовые слои, без `tests/`):
#
#   метрика        функций   медиана   p90   p95   p99   максимум
#   сложность          840         1     4     5    10         24
#   операторы          717         3    13    21    41         75
#   ветвления          368         2     5     7    16         23
#   аргументы          566         1     4     5     7         12
#   возвраты           586         1     3     3     6          9
#   длина тела         835         5    24    41    84        285
#
# ⚠️ Префикс `PL` стоял в наборе и раньше, то есть PLR0911/0912/0913/0915
# работали всё это время на умолчаниях `ruff`. Здесь они записаны ЯВНО —
# не чтобы поменять поведение, а чтобы обновление `ruff` не сдвинуло порог
# молча. Это тот же довод, по которому в проекте закреплены версии
# зависимостей: число, от которого зависит прогон, называется явно.

[tool.ruff.lint.mccabe]
# 10 — классический порог Маккейба, и он же ровно p99 этого дерева.
# Замер: порог 10 даёт 7 срабатываний (0.8% функций), порог 8 — 13,
# порог 5 — 40. Семь — это список на рефакторинг, сорок — это шум.
max-complexity = 10

[tool.ruff.lint.pylint]
# Умолчание `ruff` — 50, даёт 5 срабатываний. Взято 40: это p99 (41),
# то есть граница настоящего хвоста, и даёт 8. Порог 30 дал бы 17 —
# уже не хвост, а пятая часть длинных функций слоя окна.
max-statements = 40
# Умолчание `ruff`. Даёт 4 срабатывания, и все четыре входят в семёрку C901 —
# отдельного списка эта метрика не создаёт, она страхует C901 на случай
# длинной цепочки без вложенности.
max-branches = 12
# Умолчание `ruff`. Даёт 17 срабатываний, и это не монстры, а широкие
# конструкторы предметной области: свеча — это OHLCV плюс таймфрейм плюс
# полнота. Порог не ослаблен намеренно: 17 видимых нарушений — это список,
# который либо разберут, либо объяснят подавлением с причиной. В `tests/**`
# правило уже отключено отдельно, там сборщик фикстуры бывает и на восемь полей.
max-args = 5
# Умолчание `ruff`. Даёт 5 срабатываний. Для разбора свечи ранние возвраты —
# это и есть форма «десяти шагов»: `PROTOTYPE.md` §2 состоит из шагов
# «условие → выход». Порог не ужимается, чтобы рефакторинг не начал прятать
# шаги во вложенность ради числа.
max-returns = 6

[tool.ruff.lint.per-file-ignores]
# Тесты. Каждое послабление — с ценой, а не «тесты же».
#   D1xx    — 230 из 1010 тестовых функций сейчас без докстринга (замер
#             31.08.2026). Требовать его — 230 правок документации и ноль
#             найденных дефектов; у части тестов утверждение и есть имя.
#             В семи продуктовых слоях D1xx остаются ВКЛЮЧЁННЫМИ
#   PLR2004 — сравнение с числом в тесте и есть проверка: `assert count == 5`
#   PLR0913 — у сборщика фикстуры бывает восемь параметров: это поля свечи
#             (OHLCV, таймфрейм, полнота), а не запущенная сигнатура
#   ANN     — оснастка держит подставные объекты и намеренно неполные заглушки
#
# `SLF001` в этот список НЕ входит намеренно. Обращение к приватному члену
# из теста — настоящая связанность с внутренностями, она ломается при
# ближайшем рефакторинге, и каждое такое место обязано быть названо
# подавлением с причиной. Девять существующих `# noqa: SLF001` остаются живыми.
"tests/**" = [
    "D100", "D101", "D102", "D103", "D104", "ANN001", "ANN002", "ANN003",
    "ANN201", "ANN202", "PLR2004", "PLR0913",
    # Отложенный импорт внутри теста — приём, а не небрежность: он держит Qt
    # и слой окна вне времени сбора тестов. Замер: 85 находок в тестах против
    # 4 в продукте, где приём объяснён подавлением с причиной.
    "PLC0415",
    # Подставной обработчик обязан иметь подпись настоящего и вправе не читать
    # часть аргументов: `def handler(url)`, который url игнорирует. 52 + 23 + 6.
    "ARG001", "ARG005", "ARG002",
]
# `tools/` — оснастка разработчика, не поставка. `PLC0415` здесь НЕ гасится:
# импорт после установки переменных окружения — тот же приём, что в `app/main.py`,
# и объясняется он там подавлением с причиной, а не молчанием настройки.
"tools/**" = ["D103", "ANN001", "ANN201"]
# Слой окна переопределяет методы Qt, и их имена задаёт Qt: `paintEvent`,
# `wheelEvent`, `rowCount`, `headerData`, `closeEvent`. Все 12 находок N802 —
# ровно эти переопределения, переименовать их нельзя: Qt не найдёт метод.
"ui/**" = ["N802"]

[tool.ruff.format]
# Кавычки — замер по дереву 31.08.2026: 6958 двойных против 66 одинарных.
# Настройка описывает то, как уже написано, чтобы первый прогон форматтера
# не переписал семь тысяч строк ради вкуса.
quote-style = "double"
indent-style = "space"
# Запятая в конце списка — решение автора о разбивке по строкам, а не мусор.
skip-magic-trailing-comma = false
docstring-code-format = false

# ---------------------------------------------------------------------------
# mypy, а не `ty` от Astral. Довод замерен на этом дереве, а не взят из описаний:
# в коде уже лежит 51 подавление вида `# type: ignore[arg-type]`,
# `[attr-defined]`, `[assignment]`, `[union-attr]`, `[str-format]`, `[operator]`,
# `[method-assign]`, `[call-arg]` — это словарь кодов ошибок MYPY. Под mypy все
# 51 немедленно становятся проверяемыми (`warn_unused_ignores` скажет, какие
# из них мертвы); под любым другим checker'ом коды в скобках не значат ничего,
# и 51 подавление остаётся тем же, чем были 56 `noqa`, — формой без проверки.
#
# ⚠️ Замер, которого требовала задача Э1-0б («поставить оба, прогнать, сравнить
# находки и время»), НЕ СДЕЛАН: сети не было, ни один из инструментов
# не установился. Довод выше — про этот репозиторий, но он не заменяет прогон.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["market", "broker", "strategies", "engine", "backtest", "ui", "app", "tools", "tests"]
exclude = "^(reference|userdata|mockups)/"
# Корень репозитория в пути поиска: слои лежат в нём, а `tests/` импортирует их
# напрямую (`from market import ...`). Без этого разбор тестов упрётся
# в «Cannot find implementation» на первом же файле — и это была бы ошибка
# настройки, выданная за ошибку кода.
mypy_path = "."
explicit_package_bases = true

# Полный `strict` не включён намеренно: он ни разу не запускался, и первым же
# прогоном дал бы отчёт, который никто не разберёт. Ниже — то, что имеет цену
# в рублях: молчаливое `Any`, недостижимая ветка, забытый `await`.
warn_unused_ignores = true      # ответ на вопрос «какие из 51 ignore мертвы»
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false   # поднять после разбора первого прогона
disallow_incomplete_defs = true
show_error_codes = true
pretty = true

# Пакеты без `py.typed` (проверено 31.08.2026 в `.venv`): PySide6, httpx
# и websockets типы отдают, а эти два — нет. Для них ошибка «нет стабов»
# сказала бы о чужом пакете, а не о нашем коде.
[[tool.mypy.overrides]]
module = ["qasync.*", "pandas.*"]
ignore_missing_imports = true

# Тесты держат подставные объекты и намеренно неполные заглушки: требовать
# от них полноты аннотаций значит переписать оснастку ради checker'а.
#
# Маска в двух видах намеренно. В `tests/` нет `__init__.py` (проверено
# 31.08.2026), то есть пакета `tests` не существует и модули зовутся
# `test_layers`, а не `tests.test_layers`. Одной маски `tests.*` хватило бы
# ровно на то, чтобы не сработать ни разу и выглядеть работающей.
[[tool.mypy.overrides]]
module = [
    "tests.*", "tools.*",
]
disallow_incomplete_defs = false
check_untyped_defs = false
